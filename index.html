(function () {
	const ua = navigator.userAgent;
	const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
	let dismissed = false;
	try {
		dismissed = localStorage.getItem('gg-ios-tip') === 'closed';
	} catch (e) { /* Private mode: just show it. */ }
	if (!ios || standalone || dismissed) {
		return;
	}
	const tip = document.getElementById('ios-tip');
	tip.style.display = 'block';
	tip.querySelector('button').addEventListener('click', function (event) {
		event.stopPropagation();
		tip.style.display = 'none';
		try {
			localStorage.setItem('gg-ios-tip', 'closed');
		} catch (e) { /* Fine. */ }
	});
	setTimeout(function () { tip.style.display = 'none'; }, 15000);
}());

// Phones: the browser's address bar eats a lot of a sideways screen, so the
// first tap goes full screen (Android; iPhones can "Add to Home Screen").
(function () {
	const el = document.documentElement;
	const request = el.requestFullscreen || el.webkitRequestFullscreen;
	if (!(navigator.maxTouchPoints > 0) || !request) {
		return;
	}
	const btn = document.getElementById('full-btn');
	let tried = false;
	function isFull() {
		return !!(document.fullscreenElement || document.webkitFullscreenElement);
	}
	function lockSideways() {
		try {
			screen.orientation.lock('landscape').catch(function () {});
		} catch (e) { /* Not supported: fine. */ }
	}
	function goFull() {
		tried = true;
		try {
			const p = request.call(el, { navigationUI: 'hide' });
			if (p && p.then) {
				p.then(lockSideways).catch(function () {});
			} else {
				lockSideways();
			}
		} catch (e) { /* Blocked: the button stays available. */ }
		update();
	}
	function update() {
		btn.style.display = tried && !isFull() ? 'block' : 'none';
	}
	window.addEventListener('touchend', function () {
		if (!tried && !isFull()) {
			goFull();
		}
	}, { passive: true });
	btn.addEventListener('click', function (event) {
		event.stopPropagation();
		goFull();
	});
	document.addEventListener('fullscreenchange', update);
	document.addEventListener('webkitfullscreenchange', update);
}());

(function () {
	const hint = document.getElementById('turn-hint');
	const touch = navigator.maxTouchPoints > 0;
	function update() {
		hint.style.display = touch && window.innerHeight > window.innerWidth ? 'block' : 'none';
	}
	update();
	window.addEventListener('resize', update);
	setTimeout(function () { hint.style.opacity = '0'; }, 6000);
}());

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Postcards: share a JPEG through the phone's share sheet, or download it.
window.ggSharePhoto = function (b64, name, text) {
	try {
		const bin = atob(b64);
		const bytes = new Uint8Array(bin.length);
		for (let i = 0; i < bin.length; i++) {
			bytes[i] = bin.charCodeAt(i);
		}
		const file = new File([bytes], name, { type: 'image/jpeg' });
		if (navigator.canShare && navigator.canShare({ files: [file] })) {
			navigator.share({ files: [file], text: text }).catch(function () {});
			return 'shared';
		}
		const url = URL.createObjectURL(file);
		const link = document.createElement('a');
		link.href = url;
		link.download = name;
		document.body.appendChild(link);
		link.click();
		link.remove();
		setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
		return 'saved';
	} catch (e) {
		return 'error';
	}
};

// Update check: the export script writes version.txt next to the game files.
// When the live version differs from the one running, the game offers an
// UPDATE button (Game.update_ready / Game.apply_update), which reloads with a
// query string so even a cached page comes back fresh.
(function () {
	const running = String(GODOT_CONFIG['executable'] || '').replace(/^gg-/, '');
	window.ggNewVersion = '';
	function check() {
		if (!running || running === 'index') {
			return;
		}
		fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
			.then(function (r) { return r.ok ? r.text() : ''; })
			.then(function (t) {
				t = (t || '').trim();
				if (t && t !== running) {
					window.ggNewVersion = t;
				}
			})
			.catch(function () {});
	}
	window.ggUpdate = function () {
		// Keep a test profile (?profile=) across the update; drop everything else.
		var keep = new URLSearchParams();
		var profile = new URLSearchParams(location.search).get('profile');
		if (profile) keep.set('profile', profile);
		keep.set('v', window.ggNewVersion || String(Date.now()));
		location.replace(location.pathname + '?' + keep.toString());
	};
	setTimeout(check, 5000);
	setInterval(check, 120000);
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			check();
		}
	});
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
